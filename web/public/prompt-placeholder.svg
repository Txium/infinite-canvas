<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">灵感画布提示词预览</title>
  <desc id="desc">抽象的创意画布预览图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18233d"/>
      <stop offset="0.5" stop-color="#44366f"/>
      <stop offset="1" stop-color="#d2799b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff4d6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffb98a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="620" cy="360" r="280" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 700 C180 560 330 760 510 620 S850 520 1200 690 V900 H0Z" fill="#0b1224" fill-opacity=".55"/>
  <path d="M0 120 H1200 M0 300 H1200 M0 480 H1200 M0 660 H1200 M160 0 V900 M360 0 V900 M560 0 V900 M760 0 V900 M960 0 V900" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="600" cy="390" r="116" fill="#fff8eb" fill-opacity=".14" stroke="#fff8eb" stroke-opacity=".7" stroke-width="3"/>
  <path d="M554 470 L600 300 L646 470 L600 440 Z" fill="#fff8eb" fill-opacity=".82"/>
  <text x="600" y="760" text-anchor="middle" fill="#fff8eb" fill-opacity=".9" font-family="sans-serif" font-size="34" letter-spacing="8">灵感画布</text>
</svg>
