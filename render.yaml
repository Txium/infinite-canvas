services:
  - type: web
    name: infinite-canvas-staging
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: 168
      - key: MODEL_PROVIDER_302_API_KEY
        sync: false
      - key: MODEL_PROVIDER_WAVESPEED_API_KEY
        sync: false
      - key: MODEL_PROVIDER_LEC_API_KEY
        sync: false
      - key: MODEL_PROVIDER_SEEDANCE_NZ_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: STORAGE_DRIVER
        value: postgresql
      - key: DATABASE_DSN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://infinite-canvas-staging.onrender.com
      - key: ALIPAY_APP_ID
        sync: false
      - key: ALIPAY_APP_PRIVATE_KEY
        sync: false
      - key: ALIPAY_PUBLIC_KEY
        sync: false
      - key: ALIPAY_SELLER_ID
        sync: false
      - key: ALIPAY_PAYMENT_ENABLED
        value: false
      - key: MANAGED_PLATFORM_MODE
        value: true
      - key: GENERATION_REQUESTS_PER_MINUTE
        value: 30
