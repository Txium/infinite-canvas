services:
  - type: web
    name: infinite-canvas
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: 168
      - key: MODEL_PROVIDER_302_API_KEY
        sync: false
      - key: MODEL_PROVIDER_WAVESPEED_API_KEY
        sync: false
      - key: MODEL_PROVIDER_LEC_API_KEY
        sync: false
      - key: MODEL_PROVIDER_SEEDANCE_NZ_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: STORAGE_DRIVER
        value: sqlite
      - key: DATABASE_DSN
        value: data/infinite-canvas.db
      - key: PUBLIC_BASE_URL
        value: https://infinite-canvas-9353.onrender.com
      - key: MANAGED_PLATFORM_MODE
        value: true
